<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עברית רב-מגדרית</title>
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3e%3crect width='32' height='32' fill='%231f2937'/%3e%3ctext x='16' y='24' font-family='serif' font-size='18' fill='%2310b981' text-anchor='middle' font-weight='bold'%3e׋%3c/text%3e%3c/svg%3e" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header-controls">
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌓</button>
            <button id="shareButton" class="share-button" aria-label="Share">📤 שתפו</button>
        </div>
        
        <h1>עברית רב-מגדרית</h1>
        
        <div id="textDiv" class="text-input" contenteditable="true" placeholder="ברוכ׊׉ הבא׊׉!"></div>
        
        <div class="char-keyboard">
            <button class="char-button" data-char="׭">׭</button>
            <button class="char-button" data-char="׬">׬</button>
            <button class="char-button" data-char="׌">׌</button>
            <button class="char-button" data-char="׎">׎</button>
            <button class="char-button" data-char="׫">׫</button>
            <button class="char-button" data-char="׊">׊</button>
            <button class="char-button" data-char="׏">׏</button>
            <button class="char-button" data-char="׋">׋</button>
            <button class="char-button" data-char="׉">׉</button>
            <button class="char-button" data-char="׮">׮</button>
            <button class="char-button" data-char="׍">׍</button>
            <button class="char-button" data-char="׈">׈</button>
        </div>
        
        <canvas id="canvas" width="1200" height="400"></canvas>
    </div>

    <div class="footer-info">
        <span class="version-small">v0.4.7</span>
        <span class="footer-divider">•</span>
        <a href="https://multigenderhebrew.com/" target="_blank" class="mg-logo">עברית רב־מגדרית</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
