<!DOCTYPE html>
<html>
<head>
    <title>Text to Image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Handlee&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sriracha&display=swap" rel="stylesheet">
    <style>
    </style>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        .container {
            text-align: center;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        img {
            max-width: 100%;
            margin-top: 20px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Text to Image Generator</h1>
        <div>
            <input type="text" id="textInput" placeholder="Enter text" style="width: 300px;" ></div>
            <select id="fontSelect" style="padding:10px; font-size:16px;">
                <option value="Kalam" selected>כתב יד קלאם</option>
                <option value="Gochi Hand">כתב יד גוצ׳י</option>
                <option value="Handlee">כתב יד הנדלי</option>
                <option value="Amatic SC">כתב יד עמטיק</option>
                <option value="Caveat">כתב יד קאביט</option>
                <option value="Sriracha">כתב יד סיראצ׳ה</option>
            </select>
            <input type="number" id="sizeInput" value="24" min="8" max="144" style="width: 60px; padding:10px;" />
            <button id="getBtn">Generate Image</button>
        </div>
        <img id="resultImg" style="margin-top:20px;" />
    </div>

    <script>
        // Set default text
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('textInput').value = 'הללו וורלד';
        });

        // Generate image logic
        document.getElementById('getBtn').addEventListener('click', async function() {
            const text = encodeURIComponent(document.getElementById('textInput').value);
            const font = encodeURIComponent(document.getElementById('fontSelect').value);
            const size = document.getElementById('sizeInput').value || 24;
            const url = `/render?text=${text}&font=${font}&size=${size}`;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const blob = await response.blob();
                document.getElementById('resultImg').src = URL.createObjectURL(blob);
            } catch (err) {
                alert('Error fetching image: ' + err.message);
            }
        });
    </script>
    </body>
    </html>
