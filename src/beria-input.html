<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zaghawa/Beria Giray Erfee - to message image</title>
  <meta property="og:description" content="Keyboard mapping and image rendering" />
  <meta property="og:url" content="https://beria.vip/" />

  <meta property="og:image" content="https://beria.vip/im/test_1200x300.png"/>
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="300" />

  <link rel="stylesheet" href="fonts/Kedebideri-webfont-example.css" type="text/css">

  <style>

    body {
      font-family: KedebideriR, serif, sans-serif;
      /* font-family: KedebideriSB, serif, sans-serif; */
      font-size: 125%;
      /* margin: 20px;
      padding: 10px; */
      transition: background-color 0.3s, color 0.3s;
      background-color: #ffffff;
      color: #333333;
    }

    body.dark-mode {
      background-color: #1a1a1a;
      color: #e0e0e0;
    }

     /* For scaling below 1200px */
    .beria-textarea-wrapper {
      max-width: 1200px;
      width: auto;
      /* margin: 0 auto; */
      margin: 0;
      border: 0;
      padding: 0;
      transform-origin: top left;
      transition: transform 0.2s;
    }

    textarea {
      width: 1200px;
      /* max-width: 100%; */
      height: 300px;
      font-family: KedebideriR, serif, sans-serif;
      font-size: 24px;
      margin: 0;
      border: 0;
      padding: 0;
      /* margin-bottom: 20px; */
      /* padding: 4px;
      border: 2px solid #ccc; */
      /* border-radius: 5px; */
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    .dark-mode textarea {
      background-color: #2d2d2d;
      color: #e0e0e0;
      border-color: #555;
    }

    .info {
      background: #f0f8ff;
      border: 1px solid #0066cc;
      border-radius: 5px;
      /* padding: 10px; */
      margin-bottom: 20px;
      /* font-size: 14px; */
      transition: background-color 0.3s, border-color 0.3s;
    }

    .dark-mode .info {
      background: #1a2332;
      border-color: #4a90e2;
    }

    .dark-mode .font-status {
      background: #2d2416;
      border-color: #d39e00;
    }

    .font-status.show {
      display: block;
    }

    .virtual-keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
      max-width: 600px;
    }

    .key-button {
      padding: 4px 2px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 3px;
      font-size: 8px;
      cursor: pointer;
      min-width: 40px;
      text-align: center;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    .dark-mode .key-button {
      background: #2d2d2d;
      color: #e0e0e0;
      border-color: #555;
    }

    .key-button:hover {
      background: #f0f0f0;
    }

    .dark-mode .key-button:hover {
      background: #404040;
    }

    .key-button:active {
      background: #e0e0e0;
    }

    .dark-mode .key-button:active {
      background: #505050;
    }

    .special-key {
      background: #e6f3ff;
    }

    .dark-mode .special-key {
      background: #1a2a3a;
    }

    .theme-controls {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .theme-button {
      padding: 4px 5px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 5px;
      font-size: 8px;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
      white-space: nowrap;
    }

    .dark-mode .theme-button {
      background: #2d2d2d;
      color: #e0e0e0;
      border-color: #555;
    }

    .theme-button:hover {
      background: #f0f0f0;
    }

    .dark-mode .theme-button:hover {
      background: #404040;
    }
  </style>
</head>

<body>

  <div class="info">
    𖺩𖺾𖺽𖺾𖺼𖻂𖺽𖺾𖻍𖻂! <br>
    Beria-Zaghawa -> Image<br>
    لغة الزغاوة<br>
    For example, type 'Beria Giray Erfee' to get '𖺡𖺾𖻌𖻂𖺻 𖺥𖻂𖻌𖺻𖻓 𖺣𖻌𖺿𖺾𖺾'.<br>
  </div>

  <div class="beria-textarea-wrapper" id="beria-textarea-wrapper">
    <textarea id="beriaEl"
      placeholder="𖺩𖺾𖺽𖺾𖺼𖻂𖺽𖺾𖻍𖻂! 𖺡𖺾𖻌𖻂𖺻 𖺥𖻂𖻌𖺻𖻓: Type in Latin characters - converts to Beria Giray"></textarea>
  </div>


  <div class="theme-controls">
    <button id="theme-toggle" class="theme-button">'☀️ -> 🌙</button>
    <button id="export-png" class="theme-button">📷 download PNG</button>
    <button id="copy-image" class="theme-button">📋 Copy Image to Copyboard (paste in Whatsapp or FB messenger)</button>
    <button id="share-whatsapp" class="theme-button">💬 WhatsApp (mobile only) </button>
  </div>

  <hr>

  <div id="virtual-keyboard" class="virtual-keyboard">
    <div class="key-button special-key" data-key="v">v (stress)</div>
    <div class="key-button special-key" data-key="V">V (rising)</div>
    <div class="key-button special-key" data-key="`">` (falling)</div>
    <div class="key-button special-key" data-key="~">~ (ATR)</div>
    <div class="key-button special-key" data-key="x">x: &#x16EC8/&#x16EAD (ɲ Gna)</div>
    <div class="key-button special-key" data-key="z">z: &#x16EC9/&#x16EAE (ŋ Ngay)</div>
    <div class="key-button special-key" data-key="c">c: &#x16ECF/&#x16EB4 (∫ Shep)</div>
    <div class="key-button special-key" data-key="q">q: &#x16ECD/&#x16EB2 (ɾ Erigo-Tamura)</div>
  </div>
  <hr>
  <div id="etc">
    <ol>
      <li> <a href="https://en.wikipedia.org/wiki/Zaghawa_script">Zaghawa_script</a> (WP) </li>
      <li> <a href="https://ar.wikipedia.org/wiki/أبجدية_الزغاوة">أبجدية_الزغاوة</a> (WP) </li>
    </ol>
  </div>

  <script src="vendor/static/html2canvas/html2canvas.1.4.1.min.js"></script>

  <script>
    var gScale = 1.0;
    var gInvScale = 1.0;
    const beriaEl = document.getElementById("beriaEl");
    const themeToggle = document.getElementById("theme-toggle");
    const exportBtn = document.getElementById("export-png");
    const copyBtn = document.getElementById("copy-image");
    const whatsappBtn = document.getElementById("share-whatsapp");
    const messengerBtn = document.getElementById("share-messenger");
    const virtualKeyboard = document.getElementById("virtual-keyboard");

    // Character mapping - simplified and corrected
    const charMap = {
      // Combining marks for tones/stress
      "v": "\u0304", // COMBINING MACRON — Stress Mark
      "V": "\u0301", // COMBINING ACUTE ACCENT — Rising Tone
      "`": "\u0300", // COMBINING GRAVE ACCENT — Falling Tone
      "~": "\u0307", // COMBINING DOT ABOVE — Advanced Tongue Root

      // Special consonants
      "x": "\u{16EC8}", // Beria SMALL Gna
      "z": "\u{16EC9}", // Beria SMALL Ngay
      "c": "\u{16ECF}", // Beria SMALL Shep
      "q": "\u{16ECD}", // Beria SMALL Erigo-Tamura
      "X": "\u{16EAD}", // Capital versions
      "Z": "\u{16EAE}",
      "C": "\u{16EB4}",
      "Q": "\u{16EB2}",

      // Regular Beria letters (lowercase)
      "a": "\u{16EBB}", // ARKAB
      "b": "\u{16EBC}", // BASIGNA
      "d": "\u{16EBD}", // DARBAI
      "e": "\u{16EBE}", // EH
      "f": "\u{16EBF}", // FITKO
      "g": "\u{16EC0}", // GOWAY
      "h": "\u{16EC1}", // HIRDEABO
      "i": "\u{16EC2}", // I
      "j": "\u{16EC3}", // DJAI
      "k": "\u{16EC4}", // KOBO
      "l": "\u{16EC5}", // LAKKO
      "m": "\u{16EC6}", // MERI
      "n": "\u{16EC7}", // NINI
      "o": "\u{16ECA}", // OI
      "p": "\u{16ECB}", // PI
      "r": "\u{16ECC}", // ERIGO
      "s": "\u{16ECE}", // SERI
      "t": "\u{16ED0}", // TATASOUE
      "u": "\u{16ED1}", // UI
      "w": "\u{16ED2}", // WASSE
      "y": "\u{16ED3}", // AY

      // Regular Beria letters (uppercase)
      "A": "\u{16EA0}", // ARKAB
      "B": "\u{16EA1}", // BASIGNA
      "D": "\u{16EA2}", // DARBAI
      "E": "\u{16EA3}", // EH
      "F": "\u{16EA4}", // FITKO
      "G": "\u{16EA5}", // GOWAY
      "H": "\u{16EA6}", // HIRDEABO
      "I": "\u{16EA7}", // I
      "J": "\u{16EA8}", // DJAI
      "K": "\u{16EA9}", // KOBO
      "L": "\u{16EAA}", // LAKKO
      "M": "\u{16EAB}", // MERI
      "N": "\u{16EAC}", // NINI
      "O": "\u{16EAF}", // OI
      "P": "\u{16EB0}", // PI
      "R": "\u{16EB1}", // ERIGO
      "S": "\u{16EB3}", // SERI
      "T": "\u{16EB5}", // TATASOUE
      "U": "\u{16EB6}", // UI
      "W": "\u{16EB7}", // WASSE
      "Y": "\u{16EB8}", // AY
    };

    // Theme management with localStorage
    function getStoredTheme() {
      try {
        return localStorage.getItem('beria-theme');
      } catch (e) {
        console.warn('localStorage not available, using session storage');
        return sessionStorage.getItem('beria-theme');
      }
    }

    function setStoredTheme(theme) {
      try {
        localStorage.setItem('beria-theme', theme);
      } catch (e) {
        console.warn('localStorage not available, using session storage');
        sessionStorage.setItem('beria-theme', theme);
      }
    }

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.body.classList.add('dark-mode');
        themeToggle.textContent = '🌙 -> ☀️';
      } else {
        document.body.classList.remove('dark-mode');
        themeToggle.textContent = '☀️ -> 🌙';
      }
    }

    function toggleTheme() {
      const isDark = document.body.classList.contains('dark-mode');
      const newTheme = isDark ? 'light' : 'dark';
      applyTheme(newTheme);
      setStoredTheme(newTheme);
    }

    // Simple character conversion
    function convertChar(char) {
      return charMap[char] || char;
    }

    // Insert character at cursor position
    function insertAtCursor(textarea, text) {
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const value = textarea.value;

      textarea.value = value.slice(0, start) + text + value.slice(end);
      textarea.selectionStart = textarea.selectionEnd = start + text.length;
      textarea.focus();
    }

    // Single input handler - works for all devices
    let isProcessing = false;

    beriaEl.addEventListener('beforeinput', function (e) {
      if (isProcessing) return;

      // Only handle character insertions
      if (e.inputType !== 'insertText' || !e.data) return;

      const char = e.data;
      const convertedChar = convertChar(char);

      // If conversion happened, prevent default and insert converted char
      if (convertedChar !== char) {
        e.preventDefault();
        isProcessing = true;
        insertAtCursor(beriaEl, convertedChar);
        isProcessing = false;
      }
    });

    // Virtual keyboard handler
    virtualKeyboard.addEventListener('click', function (e) {
      if (!e.target.classList.contains('key-button')) return;

      const key = e.target.dataset.key;
      const convertedChar = convertChar(key);
      insertAtCursor(beriaEl, convertedChar);
    });

    // Responsive scaling for textarea wrapper
    function resizeTextareaWrapper() {
      const wrapper = document.getElementById('beria-textarea-wrapper');
      const baseWidth = 1200;
      const winWidth = window.innerWidth;
      const graceMargin = 0.95;
      if (graceMargin*winWidth < baseWidth) {
        const scale = graceMargin*(winWidth / baseWidth);
        gScale = scale;
        gInvScale = 1.0 / scale;
        wrapper.style.transform = `scale(${scale})`;
      } else {
        wrapper.style.transform = '';
      }
    }
    window.addEventListener('resize', resizeTextareaWrapper);
    resizeTextareaWrapper();

    // Replace manual canvas creation with html2canvas-based async function
    async function createTextCanvas() {
      // Ensure html2canvas is available
      if (typeof html2canvas !== 'function') {
        console.error('html2canvas not found. Make sure the script is loaded.');
        return null;
      }

      const text = beriaEl.value;
      if (!text || !text.trim()) return null;

      const isDark = document.body.classList.contains('dark-mode');
      const backgroundColor = isDark ? '#1a1a1a' : '#ffffff';

      // Use high scale for sharpness
// https://html2canvas.hertzen.com/configuration

      // const wrapperTextarea = document.getElementById('beria-textarea-wrapper');
      let q = beriaEl.cloneNode();
      document.body.appendChild(q);

      try {
        // beriaEl.style.border = 'none'; // Remove border for cleaner image
        // beriaEl.style.transform = ''; // Remove scaling for image capture
        // const canvas = await html2canvas(beriaEl, {
        const canvas = await html2canvas(q, {
        //const canvas = await html2canvas(wrapperTextarea, {
          // scale:	WARNING - default: window.devicePixelRatio, we want fixed: 1
          // scale: gInvScale,
          scale: 1.0,
          removeContainer: true,
          // width: 1200,
          // height: 300,
          // width: beriaEl.offsetWidth,
          // height: beriaEl.offsetHeight,
          imageTimeout: 0, // No timeout for images
          removeContainer: false,
          // letterRendering: true,
          allowTaint: true,
          useCORS: true,
          // backgroundColor: backgroundColor,
          logging: false,
          // logging: true,
        });
        return canvas;
      } catch (err) {
        console.error('html2canvas failed:', err);
        q.hidden = true;
        return null;
      }
      q.hidden = true;
    }

    // Export textarea content as PNG
    async function exportAsPNG() {
      const canvas = await createTextCanvas();
      if (!canvas) {
        alert('Nothing to export. Please enter some text first.');
        return;
      }
      const link = document.createElement('a');
      link.download = `beria-text-${new Date().toISOString().slice(0, 10)}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Copy image to clipboard
    async function copyImageToClipboard() {
      // Ensure window and textarea are focused before copying
      window.focus();
      beriaEl.focus();

      const canvas = await createTextCanvas();
      if (!canvas) {
        alert('Refusing to create empty image. Please enter some text first.');
        return;
      }

      try {
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (navigator.clipboard && navigator.clipboard.write) {
          await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
          const originalText = copyBtn.textContent;
          copyBtn.textContent = '✅ Copied to Clipboard: Paste in Whatsapp or FB messenger';
          copyBtn.style.background = '#d4edda';
          copyBtn.style.color = '#040d0a';
          setTimeout(() => {
            copyBtn.textContent = originalText;
            copyBtn.style.background = '';
            copyBtn.style.color = '';
          }, 2000);
        } else {
          throw new Error('Clipboard API not supported');
        }
      } catch (error) {
        console.error('Failed to copy image:', error);
        alert('Failed to copy image to clipboard. Try using the download option instead.');
      }
    }

    // Share to WhatsApp (creates image and opens WhatsApp)
    async function shareToWhatsApp() {
      const canvas = await createTextCanvas();
      if (!canvas) {
        alert('Please enter some text first!');
        return;
      }

      try {
        // Web Share API path
        if (navigator.share && navigator.canShare) {
          const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
          const file = new File([blob], 'beria-text.png', { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ title: 'Beria Text', text: 'Check out this text in Beria script!', files: [file] });
            return;
          }
        }

        // Fallback: download image and open WhatsApp scheme/web
        const dataURL = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.download = 'beria-text.png';
        link.href = dataURL;
        link.click();

        setTimeout(() => {
          const whatsappText = encodeURIComponent('Check out this Beria script text! 📝');
          // mobile: whatsapp://, desktop fallback can use web.whatsapp.com
          window.open(`whatsapp://send?text=${whatsappText}`, '_blank');
        }, 500);
      } catch (error) {
        console.error('WhatsApp sharing failed:', error);
        alert('Please download the image and share it manually in WhatsApp.');
      }
    }

    // Event listeners
    themeToggle.addEventListener('click', toggleTheme);
    exportBtn.addEventListener('click', exportAsPNG);
    copyBtn.addEventListener('click', copyImageToClipboard);
    whatsappBtn.addEventListener('click', shareToWhatsApp);

    // Initialize
    async function initialize() {
      // Apply stored theme
      const storedTheme = getStoredTheme();
      if (storedTheme) {
        applyTheme(storedTheme);
      }

      // Focus textarea
      beriaEl.focus();
    }

    // Start initialization when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initialize);
    } else {
      initialize();
    }
  </script>

</body>

</html>
