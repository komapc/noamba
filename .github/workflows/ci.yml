name: CI

on:
  push:
    branches: [ master, staging ]
  pull_request:
    branches: [ master, staging ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Started here rather than via the action's start/wait-on, whose wait-on
      # aborts on the first refused connection instead of retrying.
      - name: Start static server
        run: |
          npx http-server ./src -p 8080 -c-1 > /tmp/http-server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          cat /tmp/http-server.log
          exit 1

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
