name: CI

on:
  # master pushes run these tests from deploy-pages.yml, before the deploy.
  push:
    branches: [ staging ]
  pull_request:
    branches: [ master, staging ]
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Playwright's own Chromium build, pinned by its version: a Chrome update on
      # the runner cannot break the tests (it broke the Cypress ones).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.js starts the static server (http-server on :8080).
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
